<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইস্ত্রি ভাই Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-gray-100"><main class="max-w-2xl mx-auto p-4"><div class="bg-gray-900 text-white rounded-2xl p-4 mb-4"><b class="text-xl">ইস্ত্রি ভাই — Admin Panel</b><div class="text-xs opacity-70">Cyclonix</div></div><div id="login" class="bg-white rounded-2xl p-4 space-y-3"><input id="email" class="w-full border p-3 rounded-xl" placeholder="Admin email"><input id="pass" type="password" class="w-full border p-3 rounded-xl" placeholder="Password"><button id="signin" class="w-full bg-gray-900 text-white p-3 rounded-xl font-bold">Login</button><p id="msg" class="text-sm text-red-600"></p></div><div id="panel" class="hidden"><div class="flex gap-2 mb-3"><button id="refresh" class="bg-white border px-4 py-2 rounded-xl">Refresh</button><button id="logout" class="bg-red-600 text-white px-4 py-2 rounded-xl">Logout</button></div><div id="list" class="space-y-3"></div></div></main><script src="config.js"></script><script>const $=x=>document.getElementById(x);const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const statuses=['New','Pickup','Received','Ironing','Ready','Delivered'];async function load(){let {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<p>লোড হয়নি</p>';return}$('list').innerHTML=data.length?data.map(o=>`<div class="bg-white rounded-2xl p-4"><div class="flex justify-between"><b>${o.order_id}</b><b>৳${o.total}</b></div><div>${o.name} • ${o.phone}</div><div class="text-sm text-gray-500">${o.address}</div><div class="text-sm mt-2">${Object.entries(o.items).map(([k,v])=>k+' × '+v).join(', ')}</div><select class="w-full border rounded-xl p-2 mt-3" onchange="upd('${o.id}',this.value)">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'<div class="bg-white p-5 rounded-2xl text-center">কোনো order নেই</div>'}async function upd(id,status){await db.from('orders').update({status}).eq('id',id);load()}$('signin').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(error)return $('msg').textContent='Login failed';$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()};$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(({data:{session}})=>{if(session){$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}})</script></body></html>
