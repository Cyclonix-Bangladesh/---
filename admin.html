<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইস্ত্রি ভাই | Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="login" id="loginBox"><div class="panel"><div class="logo">CYCLONIX</div><h1>ইস্ত্রি ভাই Admin</h1><p>Secure Order Management</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Login</button><div id="loginMsg"></div></form></div></div><div id="app" class="hidden"><header><div><b>CYCLONIX</b><span>ইস্ত্রি ভাই — Admin</span></div><button id="logout">Logout</button></header><main><div class="top"><div><h1>Orders</h1><p>Customer orders & status management</p></div><button id="refresh">↻ Refresh</button></div><div class="stats"><div><small>New</small><strong id="newCount">0</strong></div><div><small>Pickup</small><strong id="pickupCount">0</strong></div><div><small>Ironing</small><strong id="ironingCount">0</strong></div><div><small>Delivered</small><strong id="deliveredCount">0</strong></div></div><div class="filters"><input id="search" placeholder="নাম / ফোন / ঠিকানা দিয়ে খুঁজুন"><select id="statusFilter"><option value="">সব Status</option><option>New</option><option>Pickup</option><option>Ironing</option><option>Ready</option><option>Delivered</option><option>Cancelled</option></select></div><div id="orders" class="orders"></div></main></div><script src="config.js"></script><script src="admin.js"></script></body></html>
