<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইস্ত্রি ভাই Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;color:#111827}.head{background:#111827;color:#fff;padding:18px}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}.inp,select,button{padding:11px;border:1px solid #d1d5db;border-radius:10px}button{cursor:pointer}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;padding:14px;border-radius:14px}.order{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions a,.actions button{margin:4px;text-decoration:none}.login{max-width:420px;margin:50px auto;padding:16px}.login input{display:block;width:100%;box-sizing:border-box;margin:8px 0}.login button{width:100%;background:#111827;color:#fff}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header class=head><div class=wrap><b>CYCLONIX</b> — ইস্ত্রি ভাই Admin</div></header><div id=login class=login><div class=card><h2>Admin Login</h2><input id=email type=email placeholder="Admin email"><input id=password type=password placeholder="Password"><button id=loginBtn>Login</button><p id=loginMsg></p></div></div><main id=app class="wrap hidden"><div class=row><h1>Orders</h1><button id=logout>Logout</button></div><div class=stats><div class=stat>New<br><b id=n>0</b></div><div class=stat>Pickup<br><b id=p>0</b></div><div class=stat>Ironing<br><b id=i>0</b></div><div class=stat>Delivered<br><b id=d>0</b></div></div><div class=card><input id=search class=inp style="width:60%" placeholder="নাম / ফোন / ঠিকানা"><select id=filter><option value="">সব Status</option><option>New</option><option>Pickup</option><option>Ironing</option><option>Ready</option><option>Delivered</option><option>Cancelled</option></select><button onclick="load()">↻ Refresh</button></div><div id=orders></div></main><script src="config.js"></script><script>let db,all=[];const $=x=>document.getElementById(x);function parse(x){try{return JSON.parse(x||'[]')}catch{return[]}}function total(items){return items.reduce((s,x)=>s+(+x.price||0)*(+x.quantity||0),0)}function draw(){let q=$('search').value.toLowerCase(),f=$('filter').value;let a=all.filter(o=>(!f||o.status===f)&&(!q||[o.name,o.phone,o.address].join(' ').toLowerCase().includes(q)));['New','Pickup','Ironing','Delivered'].forEach(s=>$(s==='New'?'n':s==='Pickup'?'p':s==='Ironing'?'i':'d').textContent=all.filter(o=>o.status===s).length);$('orders').innerHTML=a.map(o=>{let items=parse(o.cloth_type);return `<div class=order><div class=row><b>Order #${o.id}</b><select onchange="status(${o.id},this.value)">${['New','Pickup','Ironing','Ready','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><p><b>${o.name||''}</b><br>${o.phone||''}<br>${o.address||''}</p><p>${items.map(x=>`${x.name} × ${x.quantity}`).join(', ')}</p><b>৳${total(items)}</b><div class=actions><a href="tel:${o.phone}">📞 Call</a> <a href="https://wa.me/88${String(o.phone||'').replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a></div></div>`}).join('')||'<div class=card>কোনো order পাওয়া যায়নি।</div>'}async function load(){let {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){$('orders').innerHTML='<div class=card>Orders load হয়নি: '+error.message+'</div>';return}all=data||[];draw()}async function status(id,s){let {error}=await db.from('orders').update({status:s}).eq('id',id);if(error)alert(error.message);else load()}$('search').oninput=draw;$('filter').onchange=draw;$('loginBtn').onclick=async()=>{db=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return $('loginMsg').textContent=error.message;$('login').classList.add('hidden');$('app').classList.remove('hidden');load()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};(async()=>{db=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let {data}=await db.auth.getSession();if(data.session){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}})();</script></body></html>
