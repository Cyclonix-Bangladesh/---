<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>ইস্ত্রি ভাই — Cyclonix</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-gray-50 text-gray-900"><header class="bg-gray-900 text-white p-4 sticky top-0"><div class="max-w-xl mx-auto flex justify-between"><div><b class="text-xl">ইস্ত্রি ভাই</b><div class="text-xs opacity-70">by Cyclonix • Door-to-Door Ironing</div></div><button id="install" class="hidden bg-white text-gray-900 px-3 py-1 rounded-lg font-bold">Install</button></div></header><main class="max-w-xl mx-auto p-4 space-y-4"><div class="bg-white rounded-2xl border p-4"><h2 class="font-bold text-lg mb-3">কাপড় নির্বাচন</h2><div id="items"></div><div class="flex justify-between font-bold text-lg mt-3 border-t pt-3"><span>মোট</span><span id="total">৳0 • 0 পিস</span></div><p id="minimum" class="text-red-600 text-sm mt-2">কমপক্ষে ১০ পিস অর্ডার করতে হবে</p></div><div class="bg-white rounded-2xl border p-4 space-y-3"><h2 class="font-bold text-lg">Pickup তথ্য</h2><input id="name" class="w-full border rounded-xl p-3" placeholder="আপনার নাম"><input id="phone" inputmode="tel" class="w-full border rounded-xl p-3" placeholder="মোবাইল নম্বর"><textarea id="address" class="w-full border rounded-xl p-3" rows="3" placeholder="Pickup/Delivery ঠিকানা"></textarea><button id="place" class="w-full bg-gray-900 text-white rounded-xl py-3 font-bold">অর্ডার করুন</button><p class="text-xs text-gray-500 text-center">অর্ডার দেওয়ার পর Order ID দেখাবে। সেটি সংরক্ষণ করুন।</p></div><div class="text-center text-sm">হেল্পলাইন: <a class="font-bold" href="tel:01822303060">01822303060</a></div></main><div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 hidden bg-gray-900 text-white px-4 py-3 rounded-xl"></div><script src="config.js"></script><script>
const items={shirt:['Shirt',10],pant:['Pant',10],saloar:['Salwar',15],saree:['Saree',20],panjabi:['Panjabi',10],paijama:['Pajama',10],bedsheet:['Bedsheet',20]};let cart={};const $=id=>document.getElementById(id),db=(window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&window.SUPABASE_URL.indexOf('YOUR_')<0)?supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;
function render(){ $('items').innerHTML=Object.entries(items).map(([k,v])=>`<div class="flex justify-between items-center border-b py-2"><div><b>${v[0]}</b><div class="text-sm text-gray-500">৳${v[1]} / পিস</div></div><div class="flex items-center gap-3"><button class="w-9 h-9 bg-gray-200 rounded-lg font-bold" onclick="chg('${k}',-1)">−</button><b>${cart[k]||0}</b><button class="w-9 h-9 bg-gray-200 rounded-lg font-bold" onclick="chg('${k}',1)">+</button></div></div>`).join('');let pcs=Object.values(cart).reduce((a,b)=>a+b,0),sum=Object.entries(cart).reduce((a,[k,q])=>a+items[k][1]*q,0);$('total').textContent=`৳${sum} • ${pcs} পিস`;$('minimum').textContent=pcs>=10?'✓ Minimum order met':'কমপক্ষে ১০ পিস অর্ডার করতে হবে';$('minimum').className=(pcs>=10?'text-green-600':'text-red-600')+' text-sm mt-2'}function chg(k,n){cart[k]=Math.max(0,(cart[k]||0)+n);if(!cart[k])delete cart[k];render()}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
$('place').onclick=async()=>{let pcs=Object.values(cart).reduce((a,b)=>a+b,0),name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim();if(pcs<10)return toast('কমপক্ষে ১০ পিস লাগবে');if(!name||!phone||!address)return toast('নাম, ফোন ও ঠিকানা দিন');if(!db)return toast('Database এখনও connect করা হয়নি');let total=Object.entries(cart).reduce((a,[k,q])=>a+items[k][1]*q,0),order_id='IB-'+Date.now().toString().slice(-8);$('place').disabled=true;$('place').textContent='Submitting...';let {error}=await db.from('orders').insert({order_id,name,phone,address,items:cart,total,status:'New'});$('place').disabled=false;$('place').textContent='অর্ডার করুন';if(error){console.error(error);return toast('Submit হয়নি। আবার চেষ্টা করুন');}cart={};render();$('name').value=$('phone').value=$('address').value='';toast('অর্ডার সফল! ID: '+order_id)};
render();let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').classList.remove('hidden')});$('install').onclick=async()=>{if(deferred){deferred.prompt();deferred=null;$('install').classList.add('hidden')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
