<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>ইস্ত্রি ভাই — Cyclonix</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#111827;margin:0}.wrap{max-width:720px;margin:auto;padding:16px}.head{background:#111827;color:#fff;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #e5e7eb;border-radius:14px;padding:12px}.top{display:flex;justify-content:space-between}.counter{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:8px}.counter button{width:38px;height:38px;border:0;border-radius:10px;font-size:20px}.counter input{width:45px;text-align:center;padding:8px}.inp{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d1d5db;border-radius:12px;margin:7px 0;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:700;font-size:16px}.muted{color:#6b7280;font-size:13px}.ok{color:#15803d}.bad{color:#dc2626}.price{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:14px}.price div{padding:7px;border-bottom:1px solid #eee}@media(max-width:520px){.grid,.price{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="wrap"><b style="font-size:24px">ইস্ত্রি ভাই</b><div>by Cyclonix • Door-to-Door Ironing</div></div></header><main class="wrap"><div class="card"><h2>কাপড় নির্বাচন</h2><div id="items" class="grid"></div><hr><div style="display:flex;justify-content:space-between;font-weight:700;font-size:18px"><span>মোট</span><span id="total">৳0 • 0 পিস</span></div><div id="minimum" class="bad">কমপক্ষে ১০ পিস অর্ডার করতে হবে</div></div><div class="card"><h2>আমাদের মূল্য তালিকা</h2><div id="priceList" class="price"></div></div><div class="card"><h2>Pickup তথ্য</h2><input id="name" class="inp" placeholder="আপনার নাম" required><input id="phone" class="inp" inputmode="tel" placeholder="মোবাইল নম্বর" required><textarea id="address" class="inp" rows="3" placeholder="Pickup/Delivery ঠিকানা" required></textarea><button id="place" class="btn">অর্ডার করুন</button><p id="msg" class="muted"></p></div><div style="text-align:center">হেল্পলাইন: <a href="tel:01822303060">01822303060</a></div></main><script src="config.js"></script><script>const clothes=[['শার্ট',10],['টি-শার্ট',10],['প্যান্ট',10],['জিন্স',10],['পাঞ্জাবি',10],['পায়জামা',10],['ফতুয়া',10],['লুঙ্গি',10],['গেঞ্জি',5],['কোট',30],['ব্লেজার',30],['ওয়েস্টকোট',15],['শাড়ি',20],['সালোয়ার',10],['কামিজ',10],['থ্রি-পিস',20],['ওড়না',5],['স্কার্ট',10],['গাউন',20],['ব্লাউজ',10],['পালাজ্জো',10],['লেহেঙ্গা',30],['বাচ্চাদের শার্ট',5],['বাচ্চাদের প্যান্ট',5],['বাচ্চাদের টি-শার্ট',5],['ফ্রক',10],['বাচ্চাদের পাঞ্জাবি',5],['বেডশিট',20],['বালিশের কভার',5],['কুশন কভার',5],['টেবিল ক্লথ',10],['পর্দা',30],['কম্বল/বড় কাপড়',30]];let cart={};const $=x=>document.getElementById(x);function render(){ $('items').innerHTML=clothes.map((x,i)=>`<div class=item><div class=top><b>${x[0]}</b><span>৳${x[1]}${i>30?' থেকে':''}</span></div><div class=counter><button onclick="chg(${i},-1)">−</button><input id=q${i} value="${cart[i]||0}" type=number min=0 onchange="setq(${i},this.value)"><button onclick="chg(${i},1)">+</button></div></div>`).join('');$('priceList').innerHTML=clothes.map(x=>`<div>${x[0]} — <b>৳${x[1]}${x[0]=='পর্দা'||x[0]=='কম্বল/বড় কাপড়'?' থেকে':''}</b></div>`).join('');calc()}function chg(i,n){cart[i]=Math.max(0,(cart[i]||0)+n);if(!cart[i])delete cart[i];render()}function setq(i,v){cart[i]=Math.max(0,parseInt(v)||0);if(!cart[i])delete cart[i];render()}function calc(){let pcs=0,total=0;Object.entries(cart).forEach(([i,q])=>{pcs+=q;total+=q*clothes[i][1]});$('total').textContent=`৳${total} • ${pcs} পিস`;$('minimum').textContent=pcs>=10?'✓ Minimum order met':'কমপক্ষে ১০ পিস অর্ডার করতে হবে';$('minimum').className=pcs>=10?'ok':'bad';return{pcs,total}}$('place').onclick=async()=>{const {pcs,total}=calc();const name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim();if(pcs<10)return $('msg').textContent='কমপক্ষে ১০ পিস লাগবে।';if(!name||!phone||!address)return $('msg').textContent='নাম, ফোন ও ঠিকানা দিন।';const details=Object.entries(cart).map(([i,q])=>({name:clothes[i][0],price:clothes[i][1],quantity:q}));const btn=$('place');btn.disabled=true;btn.textContent='অর্ডার পাঠানো হচ্ছে...';try{const db=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data,error}=await db.from('orders').insert({name,phone,address,cloth_type:JSON.stringify(details),quantity:String(pcs),status:'New'}).select('id').single();if(error)throw error;$('msg').innerHTML=`<span class=ok>অর্ডার সফল হয়েছে! Order ID: <b>IB-${data.id}</b><br>মোট ৳${total}</span>`;cart={};$('name').value='';$('phone').value='';$('address').value='';render()}catch(e){console.error(e);$('msg').textContent='অর্ডার পাঠানো যায়নি। Supabase/RLS সেটআপ পরীক্ষা করুন অথবা 01822-303060 নম্বরে ফোন করুন।'}finally{btn.disabled=false;btn.textContent='অর্ডার করুন'}};render();</script></body></html>
